<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <rect width="1200" height="780" fill="#0b1120"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <circle cx="36" cy="32" r="14" fill="#38bdf8"/>
  <text x="36" y="37" fill="#0b1120" font-size="10" font-weight="900" text-anchor="middle">V49</text>
  <text x="64" y="38" fill="#f8fafc" font-size="20" font-weight="800">VITA49Forge <tspan fill="#38bdf8">Pro</tspan></text>
  <rect x="270" y="22" width="70" height="20" rx="4" fill="#1e293b"/>
  <text x="305" y="36" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">v1.0.0</text>
  <rect x="850" y="20" width="310" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="1005" y="38" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">ANSI/VITA 49.0/49.2 VRT CERTIFIED</text>
  <g transform="translate(40, 90)">
    <rect width="360" height="640" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">VRT Radio Stream &amp; RF Tuner Config</text>
    <rect x="20" y="70" width="320" height="50" rx="6" fill="#1e293b"/>
    <text x="36" y="100" fill="#38bdf8" font-size="13" font-family="monospace">Stream ID: 0x10000001</text>
    <rect x="20" y="140" width="320" height="90" rx="6" fill="#1e293b"/>
    <text x="36" y="165" fill="#f1f5f9" font-size="12">Center Freq: 2.4 GHz | BW: 40 MHz</text>
    <text x="36" y="188" fill="#34d399" font-size="12">Sample Rate: 50 MSPS | Gain: 25.0 dB</text>
    <text x="36" y="211" fill="#64748b" font-size="12">Timestamp: UTC + Picosecond TSF</text>
    <rect x="20" y="250" width="150" height="40" rx="6" fill="#0284c7"/>
    <text x="95" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Emit IF Data</text>
    <rect x="190" y="250" width="150" height="40" rx="6" fill="#334155"/>
    <text x="265" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Emit Context</text>
  </g>
  <g transform="translate(430, 90)">
    <rect width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">VRT PACKET TYPE</text>
    <text x="20" y="70" fill="#38bdf8" font-size="28" font-weight="800">TYPE 1</text>
    <rect x="250" y="0" width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="270" y="32" fill="#94a3b8" font-size="12" font-weight="600">TIMESTAMP RESOLUTION</text>
    <text x="270" y="70" fill="#34d399" font-size="24" font-weight="800">PICOSECOND</text>
    <rect x="495" y="0" width="235" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="515" y="32" fill="#94a3b8" font-size="12" font-weight="600">TRAILER STATUS</text>
    <text x="515" y="70" fill="#facc15" font-size="24" font-weight="800">CALIBRATED</text>
    <g transform="translate(0, 130)">
      <rect width="730" height="510" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">10-Point Normative ANSI/VITA 49.0/49.2 Compliance Scorecard</text>
      <text x="600" y="36" fill="#34d399" font-size="13" font-weight="700">10/10 PASS (100%)</text>
      <line x1="24" y1="54" x2="706" y2="54" stroke="#1e293b"/>
      <text x="36" y="86" fill="#f1f5f9" font-size="13">&#x2713; Section 5.1: 32-Bit Word Alignment &amp; Standard Header Structure Packing</text>
      <text x="36" y="126" fill="#f1f5f9" font-size="13">&#x2713; Section 6.1: Type 1 IF Data Packet Framing with 32-Bit Stream ID Binding</text>
      <text x="36" y="166" fill="#f1f5f9" font-size="13">&#x2713; Section 7.1: Type 4 Context Packet Parameter Indicator &amp; Field Formatting</text>
      <text x="36" y="206" fill="#f1f5f9" font-size="13">&#x2713; Section 8.2: Picosecond Fractional Timestamping (TSF Mode 2 64-Bit Res)</text>
      <text x="36" y="246" fill="#f1f5f9" font-size="13">&#x2713; Section 8.1: UTC / GPS Integer Seconds Timestamping (TSI Mode 1/2 32-Bit)</text>
      <text x="36" y="286" fill="#f1f5f9" font-size="13">&#x2713; Section 6.2: Signed 16-Bit I/Q Complex Digital Sample Word Alignment</text>
      <text x="36" y="326" fill="#f1f5f9" font-size="13">&#x2713; Section 9.1: 32-Bit Trailer Word Event Flags (Calibrated, Valid, Over-range)</text>
      <text x="36" y="366" fill="#f1f5f9" font-size="13">&#x2713; Section 5.1.6: 4-Bit Monotonic Packet Counter Cyclic Rollover (0 to 15)</text>
      <text x="406" y="406" fill="#f1f5f9" font-size="13">&#x2713; ANSI/VITA 49.2: Type 6 Control &amp; Type 7 Acknowledge RF Command Framing</text>
      <text x="36" y="446" fill="#f1f5f9" font-size="13">&#x2713; Defense Ecosystem: Ettus USRP, Mercury Systems &amp; Curtiss-Wright VRT Interop</text>
    </g>
  </g>
</svg>